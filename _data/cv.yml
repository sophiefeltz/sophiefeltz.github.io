    Publications:
      - title: Intra-Seasonal Variability of Serial Clustering of Severe European Winter Windstorms
        authors:
          - S. Feltz, K. S. Ng, C. Allen, T. Kruschke,M. Angus, A. Quinn, G. C. Leckebusch
        publisher: Geophysical Research Letters
        releaseDate: 2026
        url: https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025GL120985
        summary:  We evaluated whether there are certain times within the winter season when windstorms are more likely to cluster, and the association with largescale modes; the North Atlantic Oscillation (NAO), East Atlantic Pattern (EA) and Scandinavian Pattern (SCA). We found a greater occurrence of clustering in the later part of the winter season. Specifically, we identified two distinct periods where clustering is enhanced, one period in the middle of the season (mid-January) and one at the end (February). 

